name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Makefile
      id: makefile
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Makefile
        setup-command: ''
        command: make -f Testfile Makefile
        timeout: 2
        max-score: 2
    - name: Output
      id: output
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Output
        setup-command: ''
        command: make -f Testfile Output
        timeout: 3
        max-score: 3
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        MAKEFILE_RESULTS: "${{steps.makefile.outputs.result}}"
        OUTPUT_RESULTS: "${{steps.output.outputs.result}}"
      with:
        runners: makefile,output
